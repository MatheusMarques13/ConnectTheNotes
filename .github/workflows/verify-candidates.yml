name: Verify candidate collaborations

# Checks proposed (not yet added) collaborations against the Deezer catalog, so
# only rows where BOTH artists are really credited can enter data/source_data.py.
# Trigger: manual dispatch, or a push touching .github/candidates-kick.
on:
  workflow_dispatch:
  push:
    paths: ['.github/candidates-kick']

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Run candidate shard
        env:
          CAND_IN: audit_data/candidates.json
          CAND_OUT: out
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: '8'
        run: python3 tools/verify_candidates.py

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cand-${{ matrix.shard }}
          path: out/candidates_done.jsonl
          if-no-files-found: ignore

  merge:
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    steps:
      # Full history: the publish step commits onto deezer-results.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch results branch
        run: git fetch origin deezer-results:deezer-results || true

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Merge
        run: |
          mkdir -p audit_data/deezer
          cat shards/cand-*/candidates_done.jsonl > /tmp/candidates_done.jsonl || true
          wc -l /tmp/candidates_done.jsonl

      - name: Publish to deezer-results branch
        run: |
          if [ ! -s /tmp/candidates_done.jsonl ]; then echo "no results"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Never force-push: this branch also carries the song verdicts, the
          # artist fan counts and the multi-source audit data.
          rm -f audit_data/deezer/candidates_done.jsonl
          git checkout deezer-results
          mkdir -p audit_data/deezer
          cp /tmp/candidates_done.jsonl audit_data/deezer/candidates_done.jsonl
          git add -f audit_data/deezer/candidates_done.jsonl
          git commit -m "Candidate collaboration verdicts ($(wc -l < audit_data/deezer/candidates_done.jsonl) rows)" || exit 0
          git push origin deezer-results
